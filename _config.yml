theme: jekyll-theme-primer

title: Sara Rands, CMHC
description: Therapy for deep thinkers, gifted adults, highly sensitive people, and neurodivergent adults
url: "https://www.sararands.com"
baseurl: ""
timezone: America/Denver
og_image: /assets/images/default-og-image.png
