<aside class="newsletter-signup{% if include.compact %} newsletter-compact{% endif %}">
  <h3>{{ include.heading | default: "Words, occasionally, in your inbox" }}</h3>
  {% unless include.compact %}
    <p>I write about giftedness, sensitivity, trauma, and life transitions.
       Every month or so I email a note with new writing, talks, and whatever else
       I've been thinking about.</p>
  {% endunless %}

  <form action="https://buttondown.com/api/emails/embed-subscribe/sararands"
        method="post"
        class="embeddable-buttondown-form">
    <label for="bd-email">Email</label>
    <input type="email" name="email" id="bd-email"
           placeholder="you@example.com" required />
    <input type="hidden" value="1" name="embed" />
    <input type="submit" value="Subscribe" />
  </form>
</aside>
